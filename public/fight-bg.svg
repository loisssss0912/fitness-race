<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice">
  <!-- input: SVG 渐变、图形路径和首页 hero 背景引用。 -->
  <!-- output: 原创科幻摔角海报回退底图。 -->
  <!-- pos: 公共静态视觉资源；一旦我被更新务必更新我的开头注释以及所属文件夹的 md。 -->
  <defs>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b6ff38" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#30d158" stop-opacity=".65"/>
      <stop offset=".72" stop-color="#0a84ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#05120b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" x2="1">
      <stop offset="0" stop-color="#240606"/>
      <stop offset=".36" stop-color="#99280f"/>
      <stop offset=".62" stop-color="#ff9f0a"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" x2="1">
      <stop offset="0" stop-color="#ffcc00"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff9f0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#fire)"/>
  <rect width="1600" height="720" fill="#05070d" opacity=".22"/>
  <circle cx="820" cy="188" r="220" fill="url(#portal)" filter="url(#glow)"/>
  <circle cx="820" cy="188" r="150" fill="none" stroke="#caff3a" stroke-width="16" opacity=".65"/>
  <circle cx="820" cy="188" r="103" fill="none" stroke="#30d158" stroke-width="8" opacity=".7"/>

  <g opacity=".45">
    <rect x="0" y="552" width="1600" height="8" fill="#fff"/>
    <rect x="0" y="596" width="1600" height="8" fill="#fff"/>
    <rect x="0" y="640" width="1600" height="8" fill="#fff"/>
  </g>

  <g transform="translate(0 18)">
